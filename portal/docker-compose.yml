services:
  mtc-portal:
    build:
      context: .
      dockerfile: Dockerfile
    image: mtc-portal:latest
    container_name: mtc-portal
    restart: unless-stopped
    ports:
      - "8085:8085"
    volumes:
      - portal_data:/app/data
    environment:
      - PORT=8085
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-mtcadmin2026}
      - SESSION_SECRET=${SESSION_SECRET:-mtc-supersecret-cms-session-key-2026}

volumes:
  portal_data:
    name: mtc_portal_data
